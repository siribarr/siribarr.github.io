.card{
  position:absolute;overflow:hidden;cursor:pointer;border-radius:10px;
  transition:
    left .72s cubic-bezier(.34,1.18,.64,1),
    top .72s cubic-bezier(.34,1.18,.64,1),
    width .72s cubic-bezier(.34,1.18,.64,1),
    height .72s cubic-bezier(.34,1.18,.64,1),
    opacity .56s ease,
    transform .72s cubic-bezier(.34,1.18,.64,1),
    box-shadow .72s ease,
    filter .65s ease;
}
.card.slot-inactive{filter:saturate(.78) brightness(.94)}
.card.slot-peek{filter:saturate(.55) brightness(.88)}

/* Active state: no halo — the centered card's own mechanism wakes (slot-center gating) */

@keyframes unfurl{0%{filter:saturate(.10) brightness(.50)}55%{filter:saturate(1.08) brightness(1.05)}100%{filter:saturate(1) brightness(1)}}

// Heliograph / Lunidex card — follow the instrument's San Francisco
// sunrise/sunset orientation and re-check while the Studiolo remains open.
function helioSolarWindow(date){
  const lat=37.7749,lon=-122.4194;
  const J=date.getTime()/86400000+2440587.5;
  const n=J-2451545.0;
  const L=(280.460+0.9856474*n)%360;
  const g=((357.528+0.9856003*n)%360)*Math.PI/180;
  const lambda=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*Math.PI/180;
  const eps=(23.439-0.0000004*n)*Math.PI/180;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lambda));
  const y=Math.tan(eps/2)**2;
  const Lrad=L*Math.PI/180;
  const eqTime=4*(180/Math.PI)*(
    y*Math.sin(2*Lrad)-2*0.0167*Math.sin(g)
    +4*0.0167*y*Math.sin(g)*Math.cos(2*Lrad)
    -0.5*y*y*Math.sin(4*Lrad)
    -1.25*0.0167*0.0167*Math.sin(2*g)
  );
  const noonUTC=720-4*lon-eqTime;
  const latR=lat*Math.PI/180;
  const cosH=(Math.sin(-0.833*Math.PI/180)-Math.sin(latR)*Math.sin(dec))/(Math.cos(latR)*Math.cos(dec));
  if(cosH < -1 || cosH > 1) return null;
  const H=Math.acos(cosH)*180/Math.PI;
  const atUTCMinutes=min=>{const d=new Date(date);d.setUTCHours(0,0,0,0);d.setUTCMinutes(min);return d;};
  return {rise:atUTCMinutes(noonUTC-H*4),set:atUTCMinutes(noonUTC+H*4)};
}
function orientHelioCard(){
  const card=document.getElementById('c5');
  const now=new Date(),solar=helioSolarWindow(now);
  const faceOverride=new URLSearchParams(window.location.search).get('helio-face');
  const isNight=faceOverride==='night'||(faceOverride!=='day'&&(!solar||now < solar.rise||now > solar.set));
  card.classList.toggle('helio-is-night',isNight);
}

// Visitor Mint card — seven generic specimens, revealed together after decoding.
window.refreshMintAppearance=function(){
  const LAY=[ /* x, y, size, rotation — composed seats; [4] is the large center */
    {x:26,y:28,s:74,r:-6},{x:118,y:20,s:60,r:5},{x:150,y:92,s:66,r:-3},
    {x:20,y:118,s:58,r:8},{x:84,y:96,s:82,r:0},{x:44,y:186,s:64,r:-7},{x:126,y:172,s:70,r:4},
  ];
  const ORDER=[4,2,0,6,5,1,3]; /* fill order: center seat first, then outward */
  const received=ids=>{window.studioloCoinIds=ids;window.dispatchEvent(new CustomEvent('studiolo:coins-loaded',{detail:{ids}}));};
  return Promise.all(ORDER.map(async(seat,i)=>{
    const p=LAY[seat],coin=document.createElement('div'),image=new Image();
    coin.className='mint-tray-coin';
    coin.style.cssText=`left:${p.x/226*100}%;top:${p.y/318*100}%;width:${p.s/226*100}%;height:${p.s/318*100}%;transform:rotate(${p.r}deg)`;
    image.alt='Sample coin';image.width=p.s;image.height=p.s;
    image.src=`art/mint-sample-${i+1}.png`;
    await image.decode();coin.append(image);return coin;
  })).then(coins=>{
    document.getElementById('mint-tray').replaceChildren(...coins);
    received([]);
  }).catch(error=>console.error('Visitor Mint artwork could not be loaded.',error));
};
refreshMintAppearance();

// ── CAROUSEL ──────────────────────────────────────────────────────
const CY=214;
const cards=[
  document.getElementById('c0'),document.getElementById('c1'),
  document.getElementById('c2'),document.getElementById('c3'),
  document.getElementById('c4'),document.getElementById('c5'),
  document.getElementById('c6'),document.getElementById('c7'),
  document.getElementById('c8'),
  document.getElementById('c10'),document.getElementById('c11'),
];
const N=cards.length;
const SLOTS={
  center:  {x:400,w:240,h:338,op:1.00,tilt:0,   z:20},
  left:    {x:174,w:193,h:286,op:0.72,tilt:-2.2, z:10},
  right:   {x:626,w:193,h:286,op:0.72,tilt:2.2,  z:10},
  farLeft: {x:-4, w:159,h:248,op:0.38,tilt:-3.8, z:5},
  farRight:{x:804,w:159,h:248,op:0.38,tilt:3.8,  z:5},
  hidden:  {x:400,w:159,h:248,op:0,   tilt:0,    z:0},
};
const SNAMES=['farLeft','left','center','right','farRight'];
const previewCard=new URLSearchParams(window.location.search).get('preview-card');
const CAROUSEL_POSITION_KEY='halyx.studiolo.position.v1';
const cardKey=card=>new URL(card.dataset.url,location.href).pathname;
const previewPositions={folio:0,archive:1,ports:2,dispatch:3,vernierscope:4,helio:5,mint:6,rum:7,matinal:8,creamery:9,disneyland:10};
let rememberedPosition=-1;
try {
  const saved=VisitStorage.getItem(CAROUSEL_POSITION_KEY);
  rememberedPosition=cards.findIndex(card=>cardKey(card)===saved);
} catch (_) { /* A restricted browser can still use the carousel normally. */ }
let active=Object.prototype.hasOwnProperty.call(previewPositions,previewCard)
  ?previewPositions[previewCard]:(rememberedPosition>=0?rememberedPosition:1),animating=false;

function rememberPosition(idx){
  try {VisitStorage.setItem(CAROUSEL_POSITION_KEY,cardKey(cards[idx]));} catch (_) {}
}
function openCard(idx){
  const url=cards[idx].dataset.url;
  if(url){rememberPosition(idx);window.location.href=Visit.destination(url);}
}

function applySlot(el,s){
  el.style.left=(s.x-s.w/2)+'px';
  el.style.top=(CY-s.h/2)+'px';
  el.style.width=s.w+'px';
  el.style.height=s.h+'px';
  el.style.opacity=s.op;
  el.style.transform='rotate('+s.tilt+'deg)';
  el.style.zIndex=s.z;
  el.style.pointerEvents=s.op===0?'none':'auto';
}
function positionAll(idx){
  rememberPosition(idx);
  cards.forEach((card,i)=>{
    card.classList.remove('slot-center','slot-inactive','slot-peek');
    let off=((i-idx)%N+N)%N; if(off>N/2) off-=N;
    const name=off>=-2&&off<=2?SNAMES[off+2]:'hidden';
    applySlot(card,SLOTS[name]);
    if(name==='center') card.classList.add('slot-center');
    else if(name==='left'||name==='right') card.classList.add('slot-inactive');
    else if(name==='farLeft'||name==='farRight') card.classList.add('slot-peek');
  });
}
function setActive(idx){
  if(animating) return;
  if(idx===active){openCard(idx);return;}
  animating=true; active=idx; positionAll(idx);
  setTimeout(()=>{animating=false;},800);
}
cards.forEach(c=>{c.style.transition='none';});
positionAll(active);
requestAnimationFrame(()=>requestAnimationFrame(()=>{cards.forEach(c=>{c.style.transition='';})}));
// Swipe + drag
let sx=0,sy=0,st=0,dragX=0,dragging=false,didDrag=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
document.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8) e.preventDefault();
},{passive:false});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,dt=Date.now()-st;
  if(Math.abs(dy)>Math.abs(dx)||Math.abs(dx)<28) return;
  if(Math.abs(dx)/dt<0.18&&Math.abs(dx)<75) return;
  didDrag=true;
  dx<0?setActive((active+1)%N):setActive((active-1+N)%N);
},{passive:true});
document.addEventListener('mousedown',e=>{dragX=e.clientX;dragging=true;});
document.addEventListener('mouseup',e=>{
  if(!dragging) return; dragging=false;
  const dx=e.clientX-dragX; if(Math.abs(dx)<40) return;
  didDrag=true;
  dx<0?setActive((active+1)%N):setActive((active-1+N)%N);
});
cards.forEach(c=>c.addEventListener('click',()=>{
  if(didDrag){didDrag=false;return;}
  openCard(cards.indexOf(c));
}));

// Keyboard navigation
document.addEventListener('keydown',e=>{
  const du=document.getElementById('dropup');
  if(du.classList.contains('open')){if(e.key==='Escape')du.classList.remove('open');return;}
  if(e.target.closest('a,button,input,textarea,select,[contenteditable="true"]')) return;
  if(e.key==='ArrowRight'){e.preventDefault();setActive((active+1)%N);}
  else if(e.key==='ArrowLeft'){e.preventDefault();setActive((active-1+N)%N);}
  else if(e.key==='Enter'){openCard(active);}
});

window.VisitCarousel={cards,get active(){return active;},center(i){active=i;animating=false;positionAll(i);}};
