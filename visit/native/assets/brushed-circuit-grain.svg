<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="brush" width="80" height="3" patternUnits="userSpaceOnUse">
      <rect width="80" height="3" fill="#a89e8a"/>
      <rect width="80" height="1" y="0" fill="#8f8570" opacity="0.55"/>
      <rect width="80" height="1" y="1.6" fill="#c2b89e" opacity="0.35"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C8603A" stroke-width="0.9" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="80" height="80" fill="url(#brush)"/>
  <rect width="80" height="80" fill="url(#hatch)"/>
</svg>
