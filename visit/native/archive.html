async function getText(url, signal, timeout=20000) {

function catalog() {

    return book;

}
function form(q=''){return `<form class="search"><label class="visually-hidden" for="query">Search the encyclopaedia</label><div class="search-row"><input id="query" name="query" type="search" value="${esc(q)}" autocomplete="off" spellcheck="false"><button type="submit">Search</button></div></form>`;}
function routeFromHash(){try{const h=location.hash.slice(1);if(h.startsWith('article/'))return {kind:'article',slug:decodeURIComponent(h.slice(8))};if(h.startsWith('search/'))return {kind:'search',q:decodeURIComponent(h.slice(7))};}catch{}return {kind:'home'};}

function isCurrent(token){return token===revision;}
function message(text, retry=false){reading.innerHTML=`<div class="archive-message"><p>${esc(text)}</p>${retry?'<button class="retry" type="button">Try again</button>':''}</div>`;}

    reading.innerHTML=`<header class="masthead"><svg class="masthead-growth" viewBox="752 14 765 946" aria-hidden="true"><image clip-path="url(#branch-only)" href="public_domain_art/archive/haeckel-mycetozoa-1904.jpg" width="2332" height="3271" filter="url(#grown-ink)"/></svg><div class="temple"><img src="public_domain_art/prepared/archive-etteilla-ruins.jpg" alt="An engraved landscape with an ancient temple and ruins"></div><div class="masthead-type"><h1>Encyclopaedia<br><i>Perpetua</i></h1></div></header>${form()}<section class="browse"><h2 class="section-heading">Selected entries</h2><div class="entries">${selected.map(a=>`<div class="entry"><a data-preview="${esc(a.slug)}" href="${articleHref(a.slug)}">${a.title}</a><p>${a.blurb}</p></div>`).join('')}</div></section>`;
    reading.scrollTop=route.scroll||0;return;
  }

      document.getElementById('contents').innerHTML='<a href="#entry-top" data-section="entry-top">Introduction</a>'+data.headings.map(h=>`<a href="#${esc(h.id)}" data-section="${esc(h.id)}">${esc(h.title)}</a>`).join('');
      articleEl.id='entry-top';document.getElementById('status').textContent=data.title;
      if(route.anchor)jump(route.anchor);else reading.scrollTop=route.scroll||0;
    }catch(e){if(isCurrent(token))message('This article could not be opened.',true);}

  }
}
function articleTarget(href, slug){
  if(!href)return null;if(href.startsWith('#'))return {anchor:href.slice(1)};
  if(href.startsWith('//'))href='https:'+href;
  let u;try{u=new URL(href,location.origin+'/article/'+encodeURIComponent(slug));}catch{return null;}
  if(!['http:','https:'].includes(u.protocol))return null;
  if(/^(en\.)?wikipedia\.org$/.test(u.hostname)&&u.pathname.startsWith('/wiki/'))return {slug:decodeURIComponent(u.pathname.slice(6)),anchor:u.hash.slice(1)};
  if(u.origin===location.origin){
    if(u.pathname.startsWith('/article/'))return {slug:decodeURIComponent(u.pathname.slice(9)),anchor:u.hash.slice(1)};
    const match=u.pathname.match(/^\/content\/wikipedia[^/]+\/(.+)/);if(match)return {slug:decodeURIComponent(match[1]),anchor:u.hash.slice(1)};

  }

const safeTags=new Set('p div section span a ul ol li dl dt dd h2 h3 h4 h5 h6 b i strong em sup sub table thead tbody tfoot tr th td caption blockquote pre code cite abbr small br hr img details summary time kbd figure figcaption s u mark'.split(' '));
const mathTags=new Set('math mrow mi mn mo msup msub msubsup mfrac msqrt mroot mfenced mtable mtr mtd mtext mstyle munderover munder mover semantics annotation mpadded mspace menclose'.split(' '));
const discardTags=new Set('script style link meta iframe object embed form input button textarea select noscript base template'.split(' '));
const safeClasses=new Set('infobox wikitable thumb thumbinner thumbcaption hatnote navbox reflist mw-references-wrap mwe-math-element'.split(' '));
function cleanContent(source,slug){
  // Rebuild an allowlisted tree; source IDs are namespaced and source scripts/styles never enter this document.
  function copy(node){
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
    const tag=node.localName.toLowerCase();if(discardTags.has(tag)||node.matches('.mw-editsection,.shortdescription,.mw-empty-elt,#toc,.toc'))return document.createDocumentFragment();
    const math=mathTags.has(tag)&&node.namespaceURI==='http://www.w3.org/1998/Math/MathML';
    if(!safeTags.has(tag)&&!math){const fragment=document.createDocumentFragment();for(const c of node.childNodes)fragment.append(copy(c));return fragment;}
    const el=math?document.createElementNS(node.namespaceURI,tag):document.createElement(tag);
    if(node.id)el.id='entry-'+node.id;
    for(const attr of ['lang','dir','title','colspan','rowspan','start','value','scope'])if(node.hasAttribute(attr))el.setAttribute(attr,node.getAttribute(attr));
    if(math)for(const attr of ['display','mathvariant','stretchy','fence','accent','accentunder','columnalign','rowalign','encoding'])if(node.hasAttribute(attr))el.setAttribute(attr,node.getAttribute(attr));
    const classes=Array.from(node.classList).filter(c=>safeClasses.has(c));if(classes.length)el.className=classes.join(' ');

    if(tag==='img'){

async function loadArticle(slug,signal){
  if(articleCache.has(slug))return articleCache.get(slug);

function jump(anchor){let id=anchor;try{id=decodeURIComponent(anchor);}catch{}const el=document.getElementById(id.startsWith('entry-')?id:'entry-'+id);if(el&&reading.contains(el))el.scrollIntoView({block:'start'});}
document.addEventListener('submit',e=>{if(e.target.matches('.search')){e.preventDefault();const q=new FormData(e.target).get('query').trim();if(q)go({kind:'search',q});}});
document.addEventListener('click',e=>{
  const retry=e.target.closest('.retry');if(retry){render(current);return;}
  const page=e.target.closest('[data-search-url]');if(page){go({kind:'search',q:current.q,searchURL:page.dataset.searchUrl});return;}

    if(a.dataset.article){e.preventDefault();go({kind:'article',slug:a.dataset.article,anchor:a.dataset.anchor});return;}
    if(a.dataset.anchor){e.preventDefault();jump(a.dataset.anchor);return;}

    if(href.startsWith('#article/')){e.preventDefault();try{go({kind:'article',slug:decodeURIComponent(href.slice(9))});}catch{}return;}

document.getElementById('previous').onclick=()=>{if(index>0){savePosition();history.back();}};
document.getElementById('forward').onclick=()=>{if(index<trail.length-1){savePosition();history.forward();}};
const platePanel=document.getElementById('plate-panel'),bookDevice=document.querySelector('.book-device'),slip=document.getElementById('preview-slip');let platePinned=false,plateTimer,slipTimer,slipVersion=0;

bookDevice.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showPlate();});bookDevice.addEventListener('pointerleave',delayedClose);platePanel.addEventListener('pointerenter',()=>clearTimeout(plateTimer));platePanel.addEventListener('pointerleave',delayedClose);bookDevice.onclick=()=>{if(platePinned)closePlate();else{showPlate();platePinned=true;}};platePanel.querySelector('button').onclick=()=>{closePlate();bookDevice.focus();};document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSlip();closePlate();}});document.addEventListener('pointerdown',e=>{if(!platePanel.contains(e.target)&&!bookDevice.contains(e.target))closePlate();});

document.addEventListener('pointerover',e=>{if(e.pointerType==='mouse'){const a=e.target.closest('[data-preview]');if(a)showSlip(a);}});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-preview]'))hideSlip();});document.addEventListener('focusin',e=>{if(e.target.matches('[data-preview]'))showSlip(e.target);});document.addEventListener('focusout',hideSlip);reading.addEventListener('scroll',hideSlip);
